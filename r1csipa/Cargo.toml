[package]
name = "r1csipa"
version = "0.1.0"
edition = "2021"
authors = ["Greg Zaverucha <gregz@microsoft.com>"]
description = "R1CS to IPA transformation with zero-knowledge support"
license = "MIT"
repository = "https://github.com/zaverucha/r1csipa"

[lib]
doctest = false

[dependencies]
halo2curves = {path = "../halo2curves", features = ["derive_serde", "bits", "serde"]}
merlin = { version = "3", default-features = false }
thiserror = { version = "1"}
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
ark-std = { version = "0.3" }
rayon = "1.8"
subtle = "2.2.1"
rand_core = { version = "0.6", default-features = false }

bellpepper-core = { version="0.4.0", default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
halo2curves = {path = "../halo2curves", features = ["asm"]}
bellpepper = { version="0.4.0", default-features = false }



[dev-dependencies]
rand = "0.8"
itertools = { version = "0.10.0", default-features = false }
criterion = "0.5"

[[bench]]
name = "ipa_benchmarks"
harness = false

[features]
print-trace = ["ark-std/print-trace"]
